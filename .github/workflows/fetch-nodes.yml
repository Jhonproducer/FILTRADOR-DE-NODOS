name: Actualizar nodos Mysterium GB

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (mínimo permitido por GitHub, no acepta menos)
  workflow_dispatch: {}       # botón "Run workflow" manual en la pestaña Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar proposals GB residential
        run: |
          mkdir -p data
          curl -sSL "https://discovery.mysterium.network/api/v3/proposals?location_country=GB&ip_type=residential" \
            -H "accept: application/json" \
            -o /tmp/raw.json
          jq -n --slurpfile nodes /tmp/raw.json --arg fetched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fetched_at: $fetched_at, nodes: $nodes[0]}' > data/nodes-gb.json

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nodes-gb.json
          git diff --cached --quiet || git commit -m "Auto: actualizar nodos GB"
          git push
