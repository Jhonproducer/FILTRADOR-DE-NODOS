<!-- TAB: CUENTAS ACTIVAS -->
                <div v-show="currentTab === 'accounts'" class="bg-white rounded-lg shadow-sm border border-gray-100">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <button @click="addAccount" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium transition">
                            + Agregar Nueva Fila
                        </button>
                        <span class="text-xs text-gray-500">Todo es editable libremente. Las colisiones se marcan en rojo.</span>
                    </div>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-white text-gray-500 text-xs uppercase tracking-wider">
                                <th class="p-4 font-medium border-b w-48">Nombre Cuenta</th>
                                <th class="p-4 font-medium border-b w-48">Nodo ID (Asignado)</th>
                                <th class="p-4 font-medium border-b w-48">IP Actual</th>
                                <th class="p-4 font-medium border-b text-center">Estado</th>
                                <th class="p-4 font-medium border-b text-right">Acciones Manuales</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm divide-y divide-gray-100">
                            <tr v-for="(acc, index) in accounts" :key="index" :class="{'bg-red-50': hasCollision(acc)}">
                                <td class="p-4"><input v-model="acc.name" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none w-full bg-white"></td>
                                <td class="p-4 font-mono"><input v-model="acc.nodeId" placeholder="Pegar ID aquí" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none w-full bg-white uppercase"></td>
                                <td class="p-4"><input v-model="acc.ip" placeholder="Pegar IP aquí" class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none w-full bg-white"></td>
                                <td class="p-4 text-center">
                                    <span v-if="hasCollision(acc)" class="px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-bold shadow-sm">⚠️ CHOQUE EN SISTEMA</span>
                                    <span v-else class="text-gray-400 text-xs">Válido</span>
                                </td>
                                <td class="p-4 text-right space-x-3">
                                    <button @click="burnNode(index)" class="text-orange-600 hover:text-orange-800 text-xs font-medium uppercase tracking-wider" title="Limpia la fila y mueve el nodo a Bloqueados">Quemar a Bloqueados</button>
                                    <button @click="removeAccount(index)" class="text-red-500 hover:text-red-700 font-bold" title="Eliminar fila por completo">✕</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
